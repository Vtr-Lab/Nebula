<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Controller</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000000;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px;
            user-select: none;
        }
        h2, h3 {
            color: #ff8a65;
            margin-top: 0;
        }
        /* 3-Column Horizontal Dashboard Layout */
        .dashboard {
            display: flex;
            flex-direction: row;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1300px;
            width: 100%;
            align-items: flex-start;
        }
        .container {
            text-align: center;
            background-color: #1a1a1a;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(230, 74, 25, 0.25);
            flex: 1;
            min-width: 340px;
            max-width: 420px;
            box-sizing: border-box;
        }
        button {
            background-color: #e64a19;
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        button:hover {
            background-color: #ff5722;
            transform: translateY(-1px);
        }
        button:active {
            background-color: #bf360c;
            transform: translateY(1px);
        }
        #connectBtn {
            background-color: #ff9800;
        }
        #connectBtn:hover {
            background-color: #ffb74d;
        }
        #status {
            margin-top: 12px;
            font-size: 14px;
            color: #b0bec5;
        }
        .connected {
            color: #ffb74d !important;
            font-weight: bold;
        }
        /* Horizontally Thick Vertical Spring-Return Slider */
        .slider-section {
            margin: 60px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .slider-section label {
            font-size: 14px;
            color: #ff8a65;
            margin-bottom: 12px;
            font-weight: bold;
        }
        input[type=range].vertical {
            writing-mode: vertical-lr;
            direction: rtl;
            width: 500px;
            height: 400px; 
            accent-color: #e64a19;
            background: #262626;
            border-radius: 80px;
            cursor: pointer;
        }
        /* Turn Buttons Layout (Side-by-Side) */
        .turn-group {
            margin-top: 20px;
        }
        .turn-group label {
            font-size: 14px;
            color: #ff8a65;
            display: block;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .turn-buttons {
            display: flex;
            gap: 15px;
            flex-direction: row;
        }
        .turn-buttons button {
            margin: 0;
            background-color: #37474f;
            padding: 20px 10px;
            font-size: 16px;
            flex: 1;
        }
        .turn-buttons button:hover {
            background-color: #455a64;
        }
        /* 8x8 Matrix Grid Styling */
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            background: #111;
            padding: 10px;
            border-radius: 10px;
            margin: 15px auto;
            max-width: 280px;
        }
        .matrix-cell {
            aspect-ratio: 1;
            background-color: #262626;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.05s;
        }
        .matrix-cell.active {
            background-color: #ff5722;
            box-shadow: 0 0 6px #ff5722;
            border-color: #ff8a65;
        }
        /* Mode selector & Presets Container */
        .controls-row {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            align-items: center;
            justify-content: space-between;
        }
        select {
            background: #262626;
            color: white;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            font-size: 14px;
        }
        /* Presets Section */
        .presets-container {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .preset-card {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
        }
        .preset-title {
            font-size: 12px;
            color: #ff8a65;
            font-weight: bold;
            margin-bottom: 5px;
        }
        /* Mini Preview Grid */
        .mini-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 1px;
            background: #000;
            padding: 3px;
            border-radius: 4px;
            margin: 0 auto 8px auto;
            width: 64px;
            height: 64px;
        }
        .mini-cell {
            background-color: #1a1a1a;
            border-radius: 1px;
        }
        .mini-cell.active {
            background-color: #ff5722;
        }
        .preset-actions {
            display: flex;
            gap: 4px;
        }
        .preset-actions button {
            padding: 6px 2px;
            font-size: 11px;
            margin: 0;
            border-radius: 6px;
        }
        .btn-load {
            background-color: #2e7d32;
        }
        .btn-load:hover {
            background-color: #388e3c;
        }
        .btn-save {
            background-color: #c62828;
        }
        .btn-save:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- 1. LEFT PANEL: Connection & Throttle Slider -->
        <div class="container">
            <h2>Nebula Control</h2>
            <button id="connectBtn" onclick="connectBluetooth()">Connect ESP32</button>
            <div id="status">Status: Disconnected</div>

            <!-- Thick Vertical Spring-Return Slider -->
            <div class="slider-section">
                <label>Throttle (Y): <span id="yVal">50</span></label>
                <input type="range" id="sliderY" class="vertical" min="0" max="100" value="50" oninput="updateSliders()">
            </div>
        </div>

        <!-- 2. MIDDLE PANEL: 8x8 LED Matrix Designer & Presets -->
        <div class="container">
            <h3>LED Matrix Designer</h3>
            
            <div class="matrix-grid" id="matrixGrid"></div>

            <div class="controls-row">
                <select id="animMode">
                    <option value="static">Static Display</option>
                    <option value="blink">Blinking Display</option>
                </select>
                <button onclick="clearMatrix()" style="background-color: #424242; width: auto; padding: 10px 15px;">Clear</button>
            </div>

            <label style="font-size: 13px; color: #b0bec5; display: block; margin-top: 15px; font-weight: bold;">Preset Slots (Load / Save):</label>
            <div class="presets-container" id="presetsContainer">
                <!-- Dynamically generated preset cards -->
            </div>
        </div>

        <!-- 3. RIGHT PANEL: Steering / Turning Arrows -->
        <div class="container">
            <h3>Steering Control</h3>
            <div class="turn-group" style="margin-top: 40px;">
                <label>Turning Direction</label>
                <div class="turn-buttons">
                    <button onmousedown="sendTurn('LEFT')" ontouchstart="sendTurn('LEFT')">&#9664; Left</button>
                    <button onmousedown="sendTurn('RIGHT')" ontouchstart="sendTurn('RIGHT')">Right &#9654;</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let bluetoothDevice;
        let bluetoothCharacteristic;

        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a6";

        // Initialize 8x8 Grid State (64 booleans)
        let matrixData = Array(64).fill(false);
        
        // 6 Preset slots storage
        let presets = Array(6).fill(null).map(() => ({
            pattern: Array(64).fill(false),
            mode: 'static'
        }));

        let isMouseDown = false;
        let targetPaintState = true;

        document.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        function buildGrid() {
            const gridEl = document.getElementById('matrixGrid');
            gridEl.innerHTML = '';
            for (let i = 0; i < 64; i++) {
                const cell = document.createElement('div');
                cell.className = 'matrix-cell' + (matrixData[i] ? ' active' : '');
                
                cell.onmousedown = (e) => {
                    e.preventDefault();
                    isMouseDown = true;
                    targetPaintState = !matrixData[i];
                    matrixData[i] = targetPaintState;
                    cell.className = 'matrix-cell' + (matrixData[i] ? ' active' : '');
                };

                cell.onmouseenter = () => {
                    if (isMouseDown) {
                        matrixData[i] = targetPaintState;
                        cell.className = 'matrix-cell' + (matrixData[i] ? ' active' : '');
                    }
                };

                gridEl.appendChild(cell);
            }
        }

        function buildPresetUI() {
            const container = document.getElementById('presetsContainer');
            container.innerHTML = '';
            
            for (let i = 0; i < 6; i++) {
                const card = document.createElement('div');
                card.className = 'preset-card';

                const title = document.createElement('div');
                title.className = 'preset-title';
                title.innerText = `Slot ${i + 1}`;
                card.appendChild(title);

                // Mini preview grid
                const miniGrid = document.createElement('div');
                miniGrid.className = 'mini-grid';
                for (let p = 0; p < 64; p++) {
                    const miniCell = document.createElement('div');
                    miniCell.className = 'mini-cell' + (presets[i].pattern[p] ? ' active' : '');
                    miniGrid.appendChild(miniCell);
                }
                card.appendChild(miniGrid);

                // Actions row (Load / Save)
                const actions = document.createElement('div');
                actions.className = 'preset-actions';

                const loadBtn = document.createElement('button');
                loadBtn.className = 'btn-load';
                loadBtn.innerText = 'Load';
                loadBtn.onclick = () => loadPreset(i + 1);

                const saveBtn = document.createElement('button');
                saveBtn.className = 'btn-save';
                saveBtn.innerText = 'Save';
                saveBtn.onclick = () => savePreset(i + 1);

                actions.appendChild(loadBtn);
                actions.appendChild(saveBtn);
                card.appendChild(actions);

                container.appendChild(card);
            }
        }

        function clearMatrix() {
            matrixData.fill(false);
            buildGrid();
        }

        function updateSliders() {
            const val = document.getElementById('sliderY').value;
            document.getElementById('yVal').innerText = val;
        }

        // Spring-return logic: auto-center slider to 50 when released
        const sliderY = document.getElementById('sliderY');
        ['mouseup', 'touchend', 'touchcancel'].forEach(eventType => {
            sliderY.addEventListener(eventType, () => {
                sliderY.value = 50;
                updateSliders();
            });
        });

        function sendTurn(direction) {
            console.log("Turn Command:", direction);
        }

        async function connectBluetooth() {
            try {
                const statusEl = document.getElementById('status');
                const connectBtnEl = document.getElementById('connectBtn');
                
                statusEl.innerText = "Status: Scanning...";
                statusEl.classList.remove('connected');
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                statusEl.innerText = "Status: Connected!";
                statusEl.classList.add('connected');
                connectBtnEl.innerText = "Connected";
                connectBtnEl.style.backgroundColor = "#555";
            } catch (error) {
                console.error(error);
                const statusEl = document.getElementById('status');
                statusEl.innerText = "Status: Connection Failed";
                statusEl.style.color = "#ef5350";
            }
        }

        // Save current board to a preset slot
        function savePreset(presetId) {
            let index = presetId - 1;
            presets[index].pattern = [...matrixData];
            presets[index].mode = document.getElementById('animMode').value;
            buildPresetUI();
            
            // Instantly transmit the saved preset to ESP32
            sendPresetPayload(presetId);
        }

        // Load a preset slot onto the active board and send to ESP32
        function loadPreset(presetId) {
            let index = presetId - 1;
            matrixData = [...presets[index].pattern];
            document.getElementById('animMode').value = presets[index].mode;
            buildGrid();
            
            // Transmit loaded preset to ESP32
            sendPresetPayload(presetId);
        }

        async function sendPresetPayload(presetId) {
            let index = presetId - 1;
            const mode = presets[index].mode;
            const pattern = presets[index].pattern;
            
            // Rotate matrix 90 degrees counter-clockwise: new_r = 7 - c, new_c = r
            let rotatedMatrix = Array(64).fill(false);
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (pattern[r * 8 + c]) {
                        let new_r = 7 - c;
                        let new_c = r;
                        rotatedMatrix[new_r * 8 + new_c] = true;
                    }
                }
            }

            let rows = [];
            for (let r = 0; r < 8; r++) {
                let byteVal = 0;
                for (let c = 0; c < 8; c++) {
                    if (rotatedMatrix[r * 8 + c]) {
                        byteVal |= (1 << (7 - c));
                    }
                }
                rows.push(byteVal);
            }

            let modeFlag = (mode === 'blink') ? '1' : '0';
            let payload = `P${presetId}:${modeFlag}:` + rows.join(',');

            console.log("Sending Preset:", payload);

            if (!bluetoothCharacteristic) {
                return;
            }

            try {
                const encoder = new TextEncoder();
                await bluetoothCharacteristic.writeValue(encoder.encode(payload));
            } catch (error) {
                console.error("Error sending preset data: ", error);
            }
        }

        buildGrid();
        buildPresetUI();
    </script>
</body>
</html>
