<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Controller</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000000;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            user-select: none;
            touch-action: manipulation;
        }
        .panel-title {
            color: #ff8a65;
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 10px 0;
        }
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            width: 100%;
            max-width: 450px;
        }
        .container {
            text-align: center;
            background-color: #1a1a1a;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(230, 74, 25, 0.25);
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        button {
            background-color: #e64a19;
            color: white;
            border: none;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 6px 0;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        button:hover {
            background-color: #ff5722;
            transform: translateY(-1px);
        }
        button:active {
            background-color: #bf360c;
            transform: translateY(1px);
        }
        #connectBtn {
            background-color: #ff9800;
        }
        #connectBtn:hover {
            background-color: #ffb74d;
        }
        #status {
            margin-top: 6px;
            font-size: 13px;
            color: #b0bec5;
        }
        .connected {
            color: #ffb74d !important;
            font-weight: bold;
        }
        .slider-section {
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
        }
        .slider-section label {
            font-size: 14px;
            color: #ff8a65;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .custom-slider-track {
            position: relative;
            width: 55px;
            height: 310px;
            background: #222;
            border-radius: 28px;
            cursor: pointer;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.8);
            touch-action: none;
        }
        .slider-center-marker {
            position: absolute;
            top: 50%;
            left: 6px;
            right: 6px;
            height: 2px;
            background: #444;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 2;
        }
        .slider-fill {
            position: absolute;
            left: 5px;
            right: 5px;
            border-radius: 4px;
            pointer-events: none;
            transition: background-color 0.15s ease;
            z-index: 1;
        }
        .slider-thumb {
            position: absolute;
            left: 50%;
            width: 63px;
            height: 36px;
            background: #ff5722;
            border: 2px solid #ff8a65;
            border-radius: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            cursor: grab;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 3;
            box-sizing: border-box;
        }
        .turn-group {
            margin-top: 5px;
            display: flex;
            flex-direction: column;
        }
        .turn-group label {
            font-size: 14px;
            color: #ff8a65;
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .turn-buttons {
            display: flex;
            gap: 12px;
            flex-direction: row;
            height: 70px;
            margin-bottom: 15px;
        }
        .turn-buttons button {
            margin: 0;
            background-color: #37474f;
            font-size: 16px;
            flex: 1;
            height: 100%;
            border-radius: 10px;
        }
        .turn-buttons button:hover {
            background-color: #455a64;
        }
        .presets-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 5px;
        }
        .preset-card {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 4px;
            text-align: center;
        }
        .preset-title {
            font-size: 10px;
            color: #ff8a65;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .mini-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 1px;
            background: #000;
            padding: 2px;
            border-radius: 3px;
            margin: 0 auto 4px auto;
            width: 36px;
            height: 36px;
        }
        .mini-cell {
            background-color: #1a1a1a;
            border-radius: 1px;
        }
        .mini-cell.active {
            background-color: #ff5722;
        }
        .preset-actions {
            display: flex;
            gap: 3px;
        }
        .preset-actions button {
            padding: 3px 2px;
            font-size: 9px;
            margin: 0;
            border-radius: 4px;
        }
        .btn-load {
            background-color: #2e7d32;
        }
        .btn-load:hover {
            background-color: #388e3c;
        }
        .btn-save {
            background-color: #c62828;
        }
        .btn-save:hover {
            background-color: #d32f2f;
        }
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            background: #111;
            padding: 8px;
            border-radius: 10px;
            margin: 6px auto;
            width: 230px;
            height: 230px;
            flex-shrink: 0;
        }
        .matrix-cell {
            background-color: #262626;
            border: 1px solid #333;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.05s;
        }
        .matrix-cell.active {
            background-color: #ff5722;
            box-shadow: 0 0 6px #ff5722;
            border-color: #ff8a65;
        }
        .controls-row {
            display: flex;
            gap: 10px;
            margin: 6px 0;
            align-items: center;
            justify-content: space-between;
        }
        select {
            background: #262626;
            color: white;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 8px;
            width: 100%;
            font-size: 13px;
        }
        @media (min-width: 1100px) {
            body {
                height: 100vh;
                overflow: hidden;
                justify-content: center;
            }
            .dashboard {
                flex-direction: row;
                justify-content: center;
                align-items: stretch;
                max-width: 1250px;
            }
            .container {
                flex: 1;
                min-width: 340px;
                max-width: 390px;
            }
            .turn-buttons {
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- 1. LEFT PANEL: Connection & Throttle Slider -->
        <div class="container">
            <div>
                <h2 class="panel-title">Nebula Control</h2>
                <button id="connectBtn" onclick="connectBluetooth()">Connect ESP32</button>
                <div id="status">Status: Disconnected</div>
            </div>

            <div class="slider-section">
                <label>Throttle (Y): <span id="yVal">0</span></label>
                <div class="custom-slider-track" id="sliderTrack">
                    <div class="slider-center-marker"></div>
                    <div class="slider-fill" id="sliderFill"></div>
                    <div class="slider-thumb" id="sliderThumb"></div>
                </div>
            </div>
        </div>

        <!-- 2. MIDDLE PANEL: 8x8 LED Matrix Designer -->
        <div class="container">
            <h3 class="panel-title">LED Matrix Designer</h3>
            
            <div class="matrix-grid" id="matrixGrid"></div>

            <div class="controls-row">
                <select id="animMode" onchange="saveCurrentState()">
                    <option value="static">Static Display</option>
                    <option value="blink">Blinking Display</option>
                    <option value="refresh">Refresh (Sweep Row-by-Row)</option>
                    <option value="pulse">Pulse Animation</option>
                </select>
                <button onclick="clearMatrix()" style="background-color: #424242; width: auto; padding: 8px 12px; margin:0;">Clear</button>
            </div>
        </div>

        <!-- 3. RIGHT PANEL: Steering Control & 6 Preset Slots -->
        <div class="container">
            <h3 class="panel-title">Steering & Presets</h3>
            <div class="turn-group">
                <label>Turning Direction</label>
                <div class="turn-buttons">
                    <button onmousedown="sendTurn('LEFT')" ontouchstart="sendTurn('LEFT')">&#9664; Left</button>
                    <button onmousedown="sendTurn('RIGHT')" ontouchstart="sendTurn('RIGHT')">Right &#9654;</button>
                </div>

                <label style="margin-top: 10px;">Preset Slots (Load / Save)</label>
                <div class="presets-container" id="presetsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        let bluetoothDevice;
        let bluetoothCharacteristic;

        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a6";

        // Load saved grid, mode, and presets from localStorage if available
        let matrixData = JSON.parse(localStorage.getItem('nebula_matrix')) || Array(64).fill(false);
        
        let savedMode = localStorage.getItem('nebula_mode') || 'static';
        document.getElementById('animMode').value = savedMode;

        let presets = JSON.parse(localStorage.getItem('nebula_presets')) || Array(6).fill(null).map(() => ({
            pattern: Array(64).fill(false),
            mode: 'static'
        }));

        let isMouseDown = false;
        let targetPaintState = true;

        document.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        function saveCurrentState() {
            localStorage.setItem('nebula_matrix', JSON.stringify(matrixData));
            localStorage.setItem('nebula_mode', document.getElementById('animMode').value);
            localStorage.setItem('nebula_presets', JSON.stringify(presets));
        }

        function buildGrid() {
            const gridEl = document.getElementById('matrixGrid');
            gridEl.innerHTML = '';
            for (let i = 0; i < 64; i++) {
                const cell = document.createElement('div');
                cell.className = 'matrix-cell' + (matrixData[i] ? ' active' : '');
                
                cell.onmousedown = (e) => {
                    e.preventDefault();
                    isMouseDown = true;
                    targetPaintState = !matrixData[i];
                    matrixData[i] = targetPaintState;
                    cell.className = 'matrix-cell' + (matrixData[i] ? ' active' : '');
                    saveCurrentState();
                };

                cell.onmouseenter = () => {
                    if (isMouseDown) {
                        matrixData[i] = targetPaintState;
                        cell.className = 'matrix-cell' + (matrixData[i] ? ' active' : '');
                        saveCurrentState();
                    }
                };

                gridEl.appendChild(cell);
            }
        }

        function buildPresetUI() {
            const container = document.getElementById('presetsContainer');
            container.innerHTML = '';
            
            for (let i = 0; i < 6; i++) {
                const card = document.createElement('div');
                card.className = 'preset-card';

                const title = document.createElement('div');
                title.className = 'preset-title';
                title.innerText = `Slot ${i + 1}`;
                card.appendChild(title);

                const miniGrid = document.createElement('div');
                miniGrid.className = 'mini-grid';
                for (let p = 0; p < 64; p++) {
                    const miniCell = document.createElement('div');
                    miniCell.className = 'mini-cell' + (presets[i].pattern[p] ? ' active' : '');
                    miniGrid.appendChild(miniCell);
                }
                card.appendChild(miniGrid);

                const actions = document.createElement('div');
                actions.className = 'preset-actions';

                const loadBtn = document.createElement('button');
                loadBtn.className = 'btn-load';
                loadBtn.innerText = 'Load';
                loadBtn.onclick = () => loadPreset(i + 1);

                const saveBtn = document.createElement('button');
                saveBtn.className = 'btn-save';
                saveBtn.innerText = 'Save';
                saveBtn.onclick = () => savePreset(i + 1);

                actions.appendChild(loadBtn);
                actions.appendChild(saveBtn);
                card.appendChild(actions);

                container.appendChild(card);
            }
        }

        function clearMatrix() {
            matrixData.fill(false);
            buildGrid();
            saveCurrentState();
        }

        let currentThrottle = 0;
        const track = document.getElementById('sliderTrack');
        const fill = document.getElementById('sliderFill');
        const thumb = document.getElementById('sliderThumb');
        const yValSpan = document.getElementById('yVal');

        function updateSliderVisuals(percentVal) {
            let displayVal = Math.round((percentVal - 50) * 2);
            yValSpan.innerText = displayVal;
            
            thumb.style.top = `${100 - percentVal}%`;

            if (percentVal > 50) {
                fill.style.top = `${100 - percentVal}%`;
                fill.style.bottom = `50%`;
                fill.style.backgroundColor = '#2196f3';
            } else if (percentVal < 50) {
                fill.style.top = `50%`;
                fill.style.bottom = `${percentVal}%`;
                fill.style.backgroundColor = '#f44336';
            } else {
                fill.style.top = `50%`;
                fill.style.bottom = `50%`;
                fill.style.backgroundColor = 'transparent';
            }
        }

        function setThrottleFromEvent(e) {
            const rect = track.getBoundingClientRect();
            const clientY = e.clientY !== undefined ? e.clientY : (e.touches ? e.touches[0].clientY : rect.top);
            
            let offsetY = clientY - rect.top;
            offsetY = Math.max(0, Math.min(rect.height, offsetY));

            let percentVal = Math.round(100 - (offsetY / rect.height) * 100);
            currentThrottle = percentVal;
            updateSliderVisuals(percentVal);
        }

        let isDragging = false;

        track.addEventListener('pointerdown', (e) => {
            isDragging = true;
            setThrottleFromEvent(e);
        });

        track.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            setThrottleFromEvent(e);
        });

        function releaseSlider(e) {
            if (!isDragging) return;
            isDragging = false;
            currentThrottle = 50;
            updateSliderVisuals(50);
        }

        track.addEventListener('pointerup', releaseSlider);
        track.addEventListener('pointercancel', releaseSlider);

        updateSliderVisuals(50);

        function sendTurn(direction) {
            console.log("Turn Command:", direction);
        }

        async function connectBluetooth() {
            try {
                const statusEl = document.getElementById('status');
                const connectBtnEl = document.getElementById('connectBtn');
                
                statusEl.innerText = "Status: Scanning...";
                statusEl.classList.remove('connected');
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                statusEl.innerText = "Status: Connected!";
                statusEl.classList.add('connected');
                connectBtnEl.innerText = "Connected";
                connectBtnEl.style.backgroundColor = "#555";
            } catch (error) {
                console.error(error);
                const statusEl = document.getElementById('status');
                statusEl.innerText = "Status: Connection Failed";
                statusEl.style.color = "#ef5350";
            }
        }

        function savePreset(presetId) {
            let index = presetId - 1;
            presets[index].pattern = [...matrixData];
            presets[index].mode = document.getElementById('animMode').value;
            buildPresetUI();
            saveCurrentState();
            sendPresetPayload(presetId);
        }

        function loadPreset(presetId) {
            let index = presetId - 1;
            matrixData = [...presets[index].pattern];
            document.getElementById('animMode').value = presets[index].mode;
            buildGrid();
            saveCurrentState();
            sendPresetPayload(presetId);
        }

        async function sendPresetPayload(presetId) {
            let index = presetId - 1;
            const mode = presets[index].mode;
            const pattern = presets[index].pattern;
            
            let rotatedMatrix = Array(64).fill(false);
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (pattern[r * 8 + c]) {
                        let new_r = 7 - c;
                        let new_c = r;
                        rotatedMatrix[new_r * 8 + new_c] = true;
                    }
                }
            }

            let rows = [];
            for (let r = 0; r < 8; r++) {
                let byteVal = 0;
                for (let c = 0; c < 8; c++) {
                    if (rotatedMatrix[r * 8 + c]) {
                        byteVal |= (1 << (7 - c));
                    }
                }
                rows.push(byteVal);
            }

            // Send mode flag identifiers to ESP32: static='0', blink='1', refresh='2', pulse='3'
            let modeFlag = '0';
            if (mode === 'blink') modeFlag = '1';
            else if (mode === 'refresh') modeFlag = '2';
            else if (mode === 'pulse') modeFlag = '3';

            let payload = `P${presetId}:${modeFlag}:` + rows.join(',');

            if (!bluetoothCharacteristic) {
                return;
            }

            try {
                const encoder = new TextEncoder();
                await bluetoothCharacteristic.writeValue(encoder.encode(payload));
            } catch (error) {
                console.error("Error sending preset data: ", error);
            }
        }

        buildGrid();
        buildPresetUI();
    </script>
</body>
</html>
