<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Controller</title>
    <style>
    /* ==========================================
       1. BASE & RESET STYLES
       ========================================== */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #000000;
        color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 15px;
        box-sizing: border-box;
        user-select: none;
        touch-action: none;
    }

    /* ==========================================
       2. TYPOGRAPHY HIERARCHY
       ========================================== */
    .ui-title {
        color: #ff8a65;
        font-size: 18px;
        font-weight: bold;
        margin: 0 0 5px 0;
    }

    .ui-subtitle {
        font-size: 12px;
        color: #b0bec5;
        font-weight: bold;
        margin-bottom: 8px;
        background: rgba(255, 138, 101, 0.1);
        padding: 3px 10px;
        border-radius: 4px;
        border: 1px solid rgba(255, 138, 101, 0.2);
        display: inline-block;
    }

    /* ==========================================
       3. THREE-BOX LAYOUT STRUCTURE
       ========================================== */
    .dashboard {
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: stretch;
        width: 100%;
        max-width: 1200px;
    }

    .dashboard-box {
        background-color: #1a1a1a;
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        width: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        border: 1px solid #333;
    }

    @media (min-width: 900px) {
        .dashboard {
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
        }
        .dashboard-box {
            flex: 1;
            min-height: 550px;
        }
    }

    /* ==========================================
       4. FUNCTIONAL ELEMENTS
       ========================================== */
    button {
        background-color: #e64a19;
        color: white;
        border: none;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        margin: 4px 0;
        transition: all 0.2s ease;
        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        touch-action: none;
    }
    button:hover { background-color: #ff5722; }
    button:active { background-color: #bf360c; }
    
    #connectBtn { background-color: #ff9800; }
    #estopBtn { background-color: #d32f2f; }
    #estopBtn:hover { background-color: #f44336; }

    #status {
        margin-top: 5px;
        font-size: 13px;
        color: #b0bec5;
    }
    .connected {
        color: #ffb74d !important;
        font-weight: bold;
    }

    .telemetry-box {
        margin-top: 6px;
        width: 100%;
        background: #222;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 10px;
        box-sizing: border-box;
    }

    .slider-section {
        margin: 5px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
    }
    .slider-section label {
        font-size: 14px;
        color: #f0f0f0;
        margin-bottom: 6px;
        font-weight: 500;
    }

    .custom-slider-track {
        position: relative;
        width: 60px;
        height: 250px;
        background: #222;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
        touch-action: none;
    }
    .slider-center-marker {
        position: absolute;
        top: 50%;
        left: 6px;
        right: 6px;
        height: 2px;
        background: #444;
        transform: translateY(-50%);
        pointer-events: none;
        z-index: 2;
    }
    .slider-fill {
        position: absolute;
        left: 4px;
        right: 4px;
        border-radius: 4px;
        pointer-events: none;
        z-index: 1;
    }
    .slider-thumb {
        position: absolute;
        left: 50%;
        width: 68px;
        height: 36px;
        background: #ff5722;
        border: 2px solid #ff8a65;
        border-radius: 18px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 3;
        box-sizing: border-box;
    }

    .turn-group {
        display: flex;
        flex-direction: column;
        width: 100%;
        align-items: center;
    }
    .turn-group label {
        font-size: 14px;
        color: #f0f0f0;
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
    }
    .turn-buttons {
        display: flex;
        gap: 12px;
        flex-direction: row;
        height: 100px;
        margin-bottom: 6px;
        width: 100%;
    }
    .turn-buttons button {
        margin: 0;
        background-color: #37474f;
        font-size: 16px;
        flex: 1;
        height: 100%;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .turn-buttons button:hover { background-color: #455a64; }

    .key-hint {
        font-size: 11px;
        background: rgba(0,0,0,0.3);
        padding: 3px 8px;
        border-radius: 4px;
        color: #b0bec5;
    }

    .quick-presets-grid, .presets-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        width: 100%;
    }
    .quick-btn {
        background-color: #2e7d32;
        font-size: 14px;
        padding: 10px 4px;
        margin: 0;
        border-radius: 8px;
        font-weight: bold;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100%;
    }

    .preset-card {
        background-color: #222;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 8px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .preset-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
    }

    .mini-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 1px;
        background: #000;
        padding: 3px;
        border-radius: 4px;
        margin: 4px auto;
        width: 52px;
        height: 52px;
        cursor: pointer;
    }
    .mini-cell {
        background-color: #1a1a1a;
        border-radius: 1px;
    }
    .mini-cell.active { background-color: #ff5722; }

    .btn-save {
        background-color: #c62828;
        padding: 6px 4px;
        font-size: 11px;
        margin: 4px 0 0 0;
        border-radius: 4px;
        width: 100%;
    }

    .matrix-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 2px;
        background: #111;
        padding: 6px;
        border-radius: 10px;
        margin: 0 auto;
        width: 190px;
        height: 190px;
    }
    .matrix-cell {
        background-color: #262626;
        border: 1px solid #333;
        border-radius: 2px;
        cursor: pointer;
    }
    .matrix-cell.active {
        background-color: #ff5722;
        box-shadow: 0 0 4px #ff5722;
        border-color: #ff8a65;
    }

    .controls-row {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        width: 100%;
    }
    select {
        background: #262626;
        color: white;
        border: 1px solid #444;
        padding: 8px;
        border-radius: 8px;
        width: 100%;
        font-size: 13px;
    }
    .metric-group { margin-bottom: 20px; text-align: left; }
    .metric-label { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; color: #f0f0f0; margin-bottom: 5px; }
    .bar-container { background-color: #222; border-radius: 6px; height: 16px; width: 100%; overflow: hidden; position: relative; border: 1px solid #444; }
    .bar-fill { height: 100%; width: 0%; transition: width 0.1s ease-in-out; border-radius: 6px; }
    #distance-fill { background-color: #28a745; }
    #pitch-fill { background-color: #17a2b8; }
    #roll-fill { background-color: #ffc107; }
</style>
</head>
<body>

    <div class="dashboard">
        <!-- 1. LEFT PANEL: LED Matrix Designer & Save Slots -->
        <div class="container">
            <h3 class="panel-title">LED Matrix Designer</h3>
            
            <div class="matrix-grid" id="matrixGrid"></div>

            <div class="controls-row">
                <select id="animMode" onchange="saveCurrentState()">
                    <option value="static">Static</option>
                    <option value="blink">Flash (Blink)</option>
                    <option value="refresh">Sweep (Refresh)</option>
                    <option value="pulse">Pulse</option>
                    <option value="inside-out">Inside Out</option>
                    <option value="outside-in">Outside In</option>
                </select>
                <button onclick="clearMatrix()" style="background-color: #424242; width: auto; padding: 8px 14px; margin:0;">Clear</button>
            </div>

            <div style="font-size: 12px; color: #ff8a65; font-weight: bold; text-align: left; width: 100%; margin-top: 4px;">Save Presets:</div>
            <div class="presets-container" id="presetsContainer"></div>
        </div>

        <!-- 2. MIDDLE PANEL: Steering Control & Live Telemetry -->
        <div class="container">
            <h3 class="panel-title">Steering & Quick Display</h3>
            <div class="turn-group">
                <label>Turning Direction</label>
                <div class="turn-buttons">
                    <button id="leftBtn">&#9664; Left <span class="key-hint">[A] [&larr;]</span></button>
                    <button id="rightBtn">Right &#9654; <span class="key-hint">[D] [&rarr;]</span></button>
                </div>

                <!-- IMU & Battery Telemetry Box (Both Horizontal Tilt Axes + Battery, Bigger Text) -->
                <div class="telemetry-box">
                    <div style="font-size: 12px; color: #ff8a65; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Live Telemetry</div>
                    <div style="display: flex; justify-content: space-between; gap: 6px;">
                        <div style="flex: 1; background: #161616; padding: 8px 4px; border-radius: 6px; border: 1px solid #333;">
                            <div style="font-size: 10px; color: #999; margin-bottom: 2px;">Pitch</div>
                            <strong id="telemetryPitch" style="color: #fff; font-size: 15px;">0.0°</strong>
                        </div>
                        <div style="flex: 1; background: #161616; padding: 8px 4px; border-radius: 6px; border: 1px solid #333;">
                            <div style="font-size: 10px; color: #999; margin-bottom: 2px;">Roll</div>
                            <strong id="telemetryRoll" style="color: #fff; font-size: 15px;">0.0°</strong>
                        </div>
                        <div style="flex: 1; background: #161616; padding: 8px 4px; border-radius: 6px; border: 1px solid #333;">
                            <div style="font-size: 10px; color: #999; margin-bottom: 2px;">Battery</div>
                            <strong id="telemetryBattery" style="color: #fff; font-size: 15px;">--V</strong>
                        </div>
                    </div>
                </div>

                <label style="margin-top: 10px;">Quick Presets (1-6)</label>
                <div class="quick-presets-grid">
                    <button class="quick-btn" onclick="playPreset(1)">P1 <span class="key-hint" style="padding:1px 4px;">[1]</span></button>
                    <button class="quick-btn" onclick="playPreset(2)">P2 <span class="key-hint" style="padding:1px 4px;">[2]</span></button>
                    <button class="quick-btn" onclick="playPreset(3)">P3 <span class="key-hint" style="padding:1px 4px;">[3]</span></button>
                    <button class="quick-btn" onclick="playPreset(4)">P4 <span class="key-hint" style="padding:1px 4px;">[4]</span></button>
                    <button class="quick-btn" onclick="playPreset(5)">P5 <span class="key-hint" style="padding:1px 4px;">[5]</span></button>
                    <button class="quick-btn" onclick="playPreset(6)">P6 <span class="key-hint" style="padding:1px 4px;">[6]</span></button>
                </div>
            </div>
                        <!-- Distance Section -->
            <div class="metric-group">
                <div class="metric-label">
                    <span>Distance</span>
                    <span id="distance-val">-- cm</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill" id="distance-fill"></div>
                </div>
            </div>
            
            <!-- Pitch Section -->
            <div class="metric-group">
                <div class="metric-label">
                    <span>Pitch (Tilt)</span>
                    <span id="pitch-val">--°</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill" id="pitch-fill"></div>
                </div>
            </div>
            
            <!-- Roll Section -->
            <div class="metric-group">
                <div class="metric-label">
                    <span>Roll (Tilt)</span>
                    <span id="roll-val">--°</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill" id="roll-fill"></div>
                </div>
            </div>
        </div>

        <!-- 3. RIGHT PANEL: Nebula Control & Throttle Slider -->
        <div class="container">
            <div style="width: 100%;">
                <h2 class="panel-title">Nebula Control</h2>
                <button id="connectBtn" onclick="connectBluetooth()">Connect ESP32</button>
                <button id="estopBtn" onclick="emergencyStop()">EMERGENCY STOP <span class="key-hint" style="background:rgba(0,0,0,0.2); color:#fff;">[Esc]</span></button>
                <div id="status">Status: Disconnected</div>
            </div>

            <div class="slider-section">
                <label>Throttle (Y): <span id="yVal">0</span></label>
                <div class="booster-label">Booster: [Spacebar]</div>
                <div class="custom-slider-track" id="sliderTrack">
                    <div class="slider-center-marker"></div>
                    <div class="slider-fill" id="sliderFill"></div>
                    <div class="slider-thumb" id="sliderThumb"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let bluetoothDevice;
        let bluetoothCharacteristic;
        let activeAnimationInterval = null;
        let previewInterval = null;
        let animTick = 0;

        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a6";

        let matrixData = JSON.parse(localStorage.getItem('nebula_matrix')) || Array(64).fill(false);
        let savedMode = localStorage.getItem('nebula_mode') || 'static';
        document.getElementById('animMode').value = savedMode;

        let presets = JSON.parse(localStorage.getItem('nebula_presets')) || Array(6).fill(null).map(() => ({
            pattern: Array(64).fill(false),
            mode: 'static'
        }));

        let isDrawing = false;
        let targetPaintState = true;

        document.addEventListener('pointerup', () => { isDrawing = false; });

        function saveCurrentState() {
            localStorage.setItem('nebula_matrix', JSON.stringify(matrixData));
            localStorage.setItem('nebula_mode', document.getElementById('animMode').value);
            localStorage.setItem('nebula_presets', JSON.stringify(presets));
        }

        function buildGrid() {
            const gridEl = document.getElementById('matrixGrid');
            gridEl.innerHTML = '';
            for (let i = 0; i < 64; i++) {
                const cell = document.createElement('div');
                cell.className = 'matrix-cell' + (matrixData[i] ? ' active' : '');
                
                cell.onpointerdown = (e) => {
                    e.preventDefault();
                    isDrawing = true;
                    targetPaintState = !matrixData[i];
                    matrixData[i] = targetPaintState;
                    cell.className = 'matrix-cell' + (matrixData[i] ? ' active' : '');
                    saveCurrentState();
                };

                cell.onpointerenter = () => {
                    if (isDrawing) {
                        matrixData[i] = targetPaintState;
                        cell.className = 'matrix-cell' + (matrixData[i] ? ' active' : '');
                        saveCurrentState();
                    }
                };

                gridEl.appendChild(cell);
            }
        }

        function getModeDisplayName(mode) {
            switch(mode) {
                case 'static': return 'Static';
                case 'blink': return 'Flash';
                case 'refresh': return 'Sweep';
                case 'pulse': return 'Pulse';
                case 'inside-out': return 'Inside-Out';
                case 'outside-in': return 'Outside-In';
                default: return 'Static';
            }
        }

        function buildPresetUI() {
            const container = document.getElementById('presetsContainer');
            container.innerHTML = '';
            
            for (let i = 0; i < 6; i++) {
                const card = document.createElement('div');
                card.className = 'preset-card';

                const header = document.createElement('div');
                header.className = 'preset-header';

                const title = document.createElement('div');
                title.className = 'preset-title';
                title.innerText = `Slot ${i + 1}`;
                header.appendChild(title);

                const modeTag = document.createElement('div');
                modeTag.className = 'preset-mode-tag';
                modeTag.innerText = getModeDisplayName(presets[i].mode);
                header.appendChild(modeTag);

                card.appendChild(header);

                const miniGrid = document.createElement('div');
                miniGrid.className = 'mini-grid';
                miniGrid.id = `miniGrid-${i}`;
                for (let p = 0; p < 64; p++) {
                    const miniCell = document.createElement('div');
                    miniCell.className = 'mini-cell' + (presets[i].pattern[p] ? ' active' : '');
                    miniGrid.appendChild(miniCell);
                }
                
                miniGrid.onclick = () => {
                    matrixData = [...presets[i].pattern];
                    document.getElementById('animMode').value = presets[i].mode;
                    buildGrid();
                    saveCurrentState();
                };
                card.appendChild(miniGrid);

                const saveBtn = document.createElement('button');
                saveBtn.className = 'btn-save';
                saveBtn.innerText = 'Save';
                saveBtn.onclick = () => savePreset(i + 1);
                card.appendChild(saveBtn);

                container.appendChild(card);
            }
            updateMiniGridPreviews();
        }

        function updateMiniGridPreviews() {
            if (previewInterval) clearInterval(previewInterval);
            
            previewInterval = setInterval(() => {
                animTick++;
                for (let i = 0; i < 6; i++) {
                    const gridEl = document.getElementById(`miniGrid-${i}`);
                    if (!gridEl) continue;
                    const cells = gridEl.children;
                    const p = presets[i];
                    const patternToUse = p.pattern;

                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c < 8; c++) {
                            let idx = r * 8 + c;
                            let cellEl = cells[idx];
                            if (!cellEl) continue;
                            
                            let baseActive = patternToUse[idx];
                            let active = baseActive;

                            if (p.mode === 'blink') {
                                active = baseActive && (Math.floor(animTick / 3) % 2 === 0);
                            } else if (p.mode === 'pulse') {
                                active = baseActive && (Math.floor(animTick / 2) % 2 === 0);
                            } else if (p.mode === 'refresh') {
                                let sweepRow = animTick % 8;
                                active = baseActive && (r === sweepRow);
                            } else if (p.mode === 'inside-out') {
                                let dist = Math.min(r, c, 7 - r, 7 - c);
                                let step = (animTick % 4);
                                active = baseActive && (dist >= (3 - step));
                            } else if (p.mode === 'outside-in') {
                                let dist = Math.min(r, c, 7 - r, 7 - c);
                                let step = (animTick % 4);
                                active = baseActive && (dist <= step);
                            }

                            if (active) {
                                cellEl.classList.add('active');
                            } else {
                                cellEl.classList.remove('active');
                            }
                        }
                    }
                }
            }, 150);
        }

        function clearMatrix() {
            matrixData.fill(false);
            buildGrid();
            saveCurrentState();
        }

        const track = document.getElementById('sliderTrack');
        const fill = document.getElementById('sliderFill');
        const thumb = document.getElementById('sliderThumb');
        const yValSpan = document.getElementById('yVal');

        function updateSliderVisuals(percentVal) {
            let displayVal = Math.round((percentVal - 50) * 2);
            yValSpan.innerText = displayVal;
            
            thumb.style.top = `${100 - percentVal}%`;

            if (percentVal > 50) {
                fill.style.top = `${100 - percentVal}%`;
                fill.style.bottom = `50%`;
                fill.style.backgroundColor = '#2196f3';
            } else if (percentVal < 50) {
                fill.style.top = `50%`;
                fill.style.bottom = `${percentVal}%`;
                fill.style.backgroundColor = '#f44336';
            } else {
                fill.style.top = `50%`;
                fill.style.bottom = `50%`;
                fill.style.backgroundColor = 'transparent';
            }
        }

        function handleSliderMove(e) {
            const rect = track.getBoundingClientRect();
            let clientY = e.clientY;
            let offsetY = clientY - rect.top;
            offsetY = Math.max(0, Math.min(rect.height, offsetY));

            let percentVal = Math.round(100 - (offsetY / rect.height) * 100);
            updateSliderVisuals(percentVal);
        }

        track.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            track.setPointerCapture(e.pointerId);
            handleSliderMove(e);
            
            track.onpointermove = (ev) => handleSliderMove(ev);
            track.onpointerup = (ev) => {
                track.releasePointerCapture(ev.pointerId);
                track.onpointermove = null;
                track.onpointerup = null;
                updateSliderVisuals(50);
            };
        });

        updateSliderVisuals(50);

        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        leftBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            leftBtn.setPointerCapture(e.pointerId);
            leftBtn.style.backgroundColor = '#1e88e5';
        });
        leftBtn.addEventListener('pointerup', (e) => {
            leftBtn.releasePointerCapture(e.pointerId);
            leftBtn.style.backgroundColor = '#37474f';
        });

        rightBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            rightBtn.setPointerCapture(e.pointerId);
            rightBtn.style.backgroundColor = '#1e88e5';
        });
        rightBtn.addEventListener('pointerup', (e) => {
            rightBtn.releasePointerCapture(e.pointerId);
            rightBtn.style.backgroundColor = '#37474f';
        });

        const pressedKeys = new Set();
        const validKeys = [
            'Space', 'KeyW', 'KeyS', 'KeyA', 'KeyD', 
            'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 
            'Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6',
            'Escape'
        ];

        window.addEventListener('keydown', (e) => {
            if (validKeys.includes(e.code)) {
                e.preventDefault();
            }

            if (e.code === 'Escape') emergencyStop();
            if (e.code === 'Digit1') playPreset(1);
            if (e.code === 'Digit2') playPreset(2);
            if (e.code === 'Digit3') playPreset(3);
            if (e.code === 'Digit4') playPreset(4);
            if (e.code === 'Digit5') playPreset(5);
            if (e.code === 'Digit6') playPreset(6);

            pressedKeys.add(e.code);
            evaluateKeyboardControls();
        });

        window.addEventListener('keyup', (e) => {
            pressedKeys.delete(e.code);
            evaluateKeyboardControls();
        });

        function evaluateKeyboardControls() {
            let isBoosting = pressedKeys.has('Space');
            let forwardPressed = pressedKeys.has('KeyW') || pressedKeys.has('ArrowUp');
            let backwardPressed = pressedKeys.has('KeyS') || pressedKeys.has('ArrowDown');
            let leftPressed = pressedKeys.has('KeyA') || pressedKeys.has('ArrowLeft');
            let rightPressed = pressedKeys.has('KeyD') || pressedKeys.has('ArrowRight');
            
            let throttlePercent = 50; 
            if (forwardPressed && !backwardPressed) {
                throttlePercent = isBoosting ? 100 : 75;
            } else if (backwardPressed && !forwardPressed) {
                throttlePercent = isBoosting ? 0 : 25;
            }
            updateSliderVisuals(throttlePercent);

            if (leftPressed) {
                leftBtn.style.backgroundColor = '#1e88e5';
            } else {
                leftBtn.style.backgroundColor = '#37474f';
            }

            if (rightPressed) {
                rightBtn.style.backgroundColor = '#1e88e5';
            } else {
                rightBtn.style.backgroundColor = '#37474f';
            }
        }

        async function emergencyStop() {
            updateSliderVisuals(50);
            pressedKeys.clear();
            if (bluetoothCharacteristic) {
                try {
                    const encoder = new TextEncoder();
                    await bluetoothCharacteristic.writeValue(encoder.encode("CMD:ESTOP"));
                } catch (err) {
                    console.error("E-Stop transmission error:", err);
                }
            }
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Status: EMERGENCY STOP";
            statusEl.style.color = "#ef5350";
        }

        async function connectBluetooth() {
            const statusEl = document.getElementById('status');
            const connectBtnEl = document.getElementById('connectBtn');

            if (!navigator.bluetooth) {
                statusEl.innerText = "Status: Bluetooth unsupported on iOS!";
                statusEl.style.color = "#ef5350";
                alert("Web Bluetooth is not supported in standard iOS/iPadOS browsers. Please use a Web BLE browser app from the App Store (such as 'Bluefy' or 'BLE Link') to connect your ESP32.");
                return;
            }

            try {
                statusEl.innerText = "Status: Scanning...";
                statusEl.classList.remove('connected');
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                // Expected ESP32 telemetry string format: "T:pitch,roll,battery" (e.g. "T:1.2,-0.5,14.8")
                await bluetoothCharacteristic.startNotifications();
                bluetoothCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = event.target.value;
                    const text = new TextDecoder().decode(value);
                    if (text.startsWith("T:")) {
                        let parts = text.substring(2).split(',');
                        if (parts[0]) document.getElementById('telemetryPitch').innerText = parts[0] + '°';
                        if (parts[1]) document.getElementById('telemetryRoll').innerText = parts[1] + '°';
                        if (parts[2]) document.getElementById('telemetryBattery').innerText = parts[2] + 'V';
                    }
                });

                statusEl.innerText = "Status: Connected!";
                statusEl.classList.add('connected');
                connectBtnEl.innerText = "Connected";
                connectBtnEl.style.backgroundColor = "#555";
            } catch (error) {
                console.error(error);
                statusEl.innerText = "Status: Connection Failed";
                statusEl.style.color = "#ef5350";
            }
        }

        function savePreset(presetId) {
            let index = presetId - 1;
            presets[index].pattern = [...matrixData];
            presets[index].mode = document.getElementById('animMode').value;
            buildPresetUI();
            saveCurrentState();
            playPreset(presetId);
        }

        async function playPreset(presetId) {
            let index = presetId - 1;
            matrixData = [...presets[index].pattern];
            document.getElementById('animMode').value = presets[index].mode;
            buildGrid();
            saveCurrentState();

            const mode = presets[index].mode;
            const pattern = presets[index].pattern;

            if (activeAnimationInterval) {
                clearInterval(activeAnimationInterval);
                activeAnimationInterval = null;
            }

            async function sendRows(rowsArray) {
                if (!bluetoothCharacteristic) return;
                let payload = "R:" + rowsArray.join(',');
                try {
                    const encoder = new TextEncoder();
                    await bluetoothCharacteristic.writeValue(encoder.encode(payload));
                } catch (err) {
                    console.error("Transmission error:", err);
                }
            }

            let getRowBytesForMatrix = (customPattern, filterFn = null) => {
                let rotated = Array(64).fill(false);
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if (customPattern[r * 8 + c]) {
                            if (!filterFn || filterFn(r, c)) {
                                let new_r = 7 - r;
                                let new_c = 7 - c;
                                rotated[new_r * 8 + new_c] = true;
                            }
                        }
                    }
                }
                let rows = [];
                for (let r = 0; r < 8; r++) {
                    let byteVal = 0;
                    for (let c = 0; c < 8; c++) {
                        if (rotated[r * 8 + c]) byteVal |= (1 << (7 - c));
                    }
                    rows.push(byteVal);
                }
                return rows;
            };

            let baseRows = getRowBytesForMatrix(pattern);
            let emptyRows = [0, 0, 0, 0, 0, 0, 0, 0];

            if (mode === 'static') {
                await sendRows(baseRows);
            } 
            else if (mode === 'blink') {
                let state = true;
                await sendRows(baseRows);
                activeAnimationInterval = setInterval(async () => {
                    await sendRows(state ? emptyRows : baseRows);
                    state = !state;
                }, 500);
            } 
            else if (mode === 'refresh') {
                let sweepRow = 0;
                activeAnimationInterval = setInterval(async () => {
                    let frame = [...emptyRows];
                    frame[sweepRow] = baseRows[sweepRow];
                    await sendRows(frame);
                    sweepRow++;
                    if (sweepRow > 7) sweepRow = 0;
                }, 100);
            }
            else if (mode === 'pulse') {
                let visible = true;
                activeAnimationInterval = setInterval(async () => {
                    await sendRows(visible ? baseRows : emptyRows);
                    visible = !visible;
                }, 150);
            }
            else if (mode === 'inside-out') {
                let step = 0;
                activeAnimationInterval = setInterval(async () => {
                    let rows = getRowBytesForMatrix(pattern, (r, c) => {
                        let dist = Math.min(r, c, 7 - r, 7 - c);
                        return dist >= (3 - step);
                    });
                    await sendRows(rows);
                    step = (step + 1) % 4;
                }, 150);
            }
            else if (mode === 'outside-in') {
                let step = 0;
                activeAnimationInterval = setInterval(async () => {
                    let rows = getRowBytesForMatrix(pattern, (r, c) => {
                        let dist = Math.min(r, c, 7 - r, 7 - c);
                        return dist <= step;
                    });
                    await sendRows(rows);
                    step = (step + 1) % 4;
                }, 150);
            }
        }

        buildGrid();
        buildPresetUI();
    </script>
</body>
</html>
