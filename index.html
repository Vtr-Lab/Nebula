<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Controller</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* Deep Black Background */
            background-color: #000000;
            /* Off-White Text for contrast */
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            /* Charcoal Gray Container */
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 16px;
            /* Soft shadow for depth */
            box-shadow: 0 4px 20px rgba(230, 74, 25, 0.2); 
            width: 90%;
            max-width: 350px;
        }
        h2 {
            color: #ff8a65; /* Lighter orange for title */
            margin-top: 0;
        }
        button {
            /* Vibrant Orange-Red */
            background-color: #e64a19;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            /* Smooth transition for hover effects */
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        button:hover {
            background-color: #ff5722; /* Lighter orange-red on hover */
            transform: translateY(-1px);
        }
        button:active {
            background-color: #bf360c; /* Darker red on click */
            transform: translateY(1px);
        }
        /* Specific styling for the Connect button */
        #connectBtn {
            /* Amber color to stand out as a primary action */
            background-color: #ff9800; 
        }
        #connectBtn:hover {
            background-color: #ffb74d;
        }
        #connectBtn:active {
            background-color: #f57c00;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #b0bec5; /* Cool gray for status */
        }
        /* Class applied via JS when connected */
        .connected {
            color: #ffb74d !important; /* Bright Amber when connected */
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Nebula Control</h2>
        <button id="connectBtn" onclick="connectBluetooth()">Connect ESP32</button>
        <button onclick="sendSignal('0')">Hollow Circle</button>
        <button onclick="sendSignal('1')">Solid Circle</button>
        <div id="status">Status: Disconnected</div>
    </div>

    <script>
        let bluetoothDevice;
        let bluetoothCharacteristic;

        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a6";

        async function connectBluetooth() {
            try {
                const statusEl = document.getElementById('status');
                const connectBtnEl = document.getElementById('connectBtn');
                
                statusEl.innerText = "Status: Scanning...";
                statusEl.classList.remove('connected');
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                // Update UI for successful connection
                statusEl.innerText = "Status: Connected!";
                statusEl.classList.add('connected');
                connectBtnEl.innerText = "Connected";
                connectBtnEl.style.backgroundColor = "#666"; // Gray out connect button
                connectBtnEl.onclick = null; // Disable reconnect button

            } catch (error) {
                console.error(error);
                const statusEl = document.getElementById('status');
                statusEl.innerText = "Status: Connection Failed";
                statusEl.style.color = "#ef5350"; // Light red for error
            }
        }

        async function sendSignal(value) {
            if (!bluetoothCharacteristic) {
                alert("Please connect to the ESP32 first!");
                return;
            }
            try {
                const encoder = new TextEncoder();
                await bluetoothCharacteristic.writeValue(encoder.encode(value));
            } catch (error) {
                console.error("Error sending data: ", error);
            }
        }
    </script>
</body>
</html>
