<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nebula Robot Controller & Telemetry</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #007e85;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .section-title {
            margin-top: 30px;
            color: #00adb5;
        }
        /* Horizontal Layout for IMU Axes */
        .horizontal-axis-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 15px;
        }
        .axis-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            flex: 1;
            text-align: center;
        }
        .axis-card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #aaaaaa;
        }
        .axis-value {
            font-size: 20px;
            font-weight: bold;
            color: #00adb5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Nebula Robot Dashboard</h1>
        <button id="connectBtn">Connect to Nebula BLE</button>
        <p id="status">Status: Disconnected</p>

        <h2 class="section-title">Accelerometer Data (g)</h2>
        <div class="horizontal-axis-row">
            <div class="axis-card">
                <h3>Accel X</h3>
                <div id="accelX" class="axis-value">0.000</div>
            </div>
            <div class="axis-card">
                <h3>Accel Y</h3>
                <div id="accelY" class="axis-value">0.000</div>
            </div>
            <div class="axis-card">
                <h3>Accel Z</h3>
                <div id="accelZ" class="axis-value">0.000</div>
            </div>
        </div>

        <h2 class="section-title">Gyroscope Data (°/s)</h2>
        <div class="horizontal-axis-row">
            <div class="axis-card">
                <h3>Gyro X</h3>
                <div id="gyroX" class="axis-value">0.00</div>
            </div>
            <div class="axis-card">
                <h3>Gyro Y</h3>
                <div id="gyroY" class="axis-value">0.00</div>
            </div>
            <div class="axis-card">
                <h3>Gyro Z</h3>
                <div id="gyroZ" class="axis-value">0.00</div>
            </div>
        </div>
    </div>

    <script>
        let bluetoothDevice;
        let bleCharacteristic;

        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a6";

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                document.getElementById('status').innerText = "Status: Connecting...";
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Nebula Controller' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                // Start listening for incoming IMU telemetry notifications
                await bleCharacteristic.startNotifications();
                bleCharacteristic.addEventListener('characteristicvaluechanged', handleIMUData);

                document.getElementById('status').innerText = "Status: Connected & Streaming";
                document.getElementById('connectBtn').style.backgroundColor = "#28a745";
                document.getElementById('connectBtn').innerText = "Connected";

            } catch (error) {
                console.error("Connection failed:", error);
                document.getElementById('status').innerText = "Status: Connection Failed";
            }
        });

        function handleIMUData(event) {
            const valueStr = new TextDecoder().decode(event.target.value);
            
            if (valueStr.startsWith("IMU:")) {
                const rawData = valueStr.substring(4); // Strip "IMU:"
                const parts = rawData.split(',');

                if (parts.length === 6) {
                    // Update the horizontal card values dynamically
                    document.getElementById('accelX').innerText = parseFloat(parts[0]).toFixed(3);
                    document.getElementById('accelY').innerText = parseFloat(parts[1]).toFixed(3);
                    document.getElementById('accelZ').innerText = parseFloat(parts[2]).toFixed(3);
                    
                    document.getElementById('gyroX').innerText = parseFloat(parts[3]).toFixed(2);
                    document.getElementById('gyroY').innerText = parseFloat(parts[4]).toFixed(2);
                    document.getElementById('gyroZ').innerText = parseFloat(parts[5]).toFixed(2);
                }
            }
        }
    </script>
</body>
</html>
