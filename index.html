<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Controller</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 350px;
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: background 0.2s;
        }
        button:active {
            background-color: #0056b3;
        }
        #connectBtn {
            background-color: #34c759;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Nebula Controller</h2>
        <button id="connectBtn" onclick="connectBluetooth()">Connect ESP32</button>
        <button onclick="sendSignal('0')">Hollow Circle</button>
        <button onclick="sendSignal('1')">Solid Circle</button>
        <div id="status">Status: Disconnected</div>
    </div>

    <script>
        let bluetoothDevice;
        let bluetoothCharacteristic;

        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a6";

        async function connectBluetooth() {
            try {
                document.getElementById('status').innerText = "Status: Scanning...";
                
                // Filtering strictly by Service UUID ignores name-caching issues entirely
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                document.getElementById('status').innerText = "Status: Connected!";
                document.getElementById('connectBtn').innerText = "Connected";
                document.getElementById('connectBtn').style.backgroundColor = "#555";
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "Status: Connection Failed";
            }
        }

        async function sendSignal(value) {
            if (!bluetoothCharacteristic) {
                alert("Please connect to the ESP32 first!");
                return;
            }
            try {
                const encoder = new TextEncoder();
                await bluetoothCharacteristic.writeValue(encoder.encode(value));
            } catch (error) {
                console.error("Error sending data: ", error);
            }
        }
    </script>
</body>
</html>
