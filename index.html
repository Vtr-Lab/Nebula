<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Controller</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000000;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            user-select: none;
            touch-action: none;
            overflow: hidden;
        }
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            height: 100%;
            max-height: 750px;
            justify-content: center;
        }
        .container {
            text-align: center;
            background-color: #1a1a1a;
            padding: 14px;
            border-radius: 14px;
            box-shadow: 0 4px 25px rgba(230, 74, 25, 0.25);
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .panel-title {
            color: #ff8a65;
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 6px 0;
        }
        button {
            background-color: #e64a19;
            color: white;
            border: none;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin: 4px 0;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            touch-action: none;
        }
        button:hover {
            background-color: #ff5722;
        }
        button:active {
            background-color: #bf360c;
        }
        #connectBtn {
            background-color: #ff9800;
        }
        #status {
            margin-top: 4px;
            font-size: 12px;
            color: #b0bec5;
        }
        .connected {
            color: #ffb74d !important;
            font-weight: bold;
        }
        .slider-section {
            margin: 2px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
        }
        .slider-section label {
            font-size: 13px;
            color: #ff8a65;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .custom-slider-track {
            position: relative;
            width: 55px;
            height: 350px;
            background: #222;
            border-radius: 28px;
            cursor: pointer;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.8);
            touch-action: none;
        }
        .slider-center-marker {
            position: absolute;
            top: 50%;
            left: 6px;
            right: 6px;
            height: 2px;
            background: #444;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 2;
        }
        .slider-fill {
            position: absolute;
            left: 5px;
            right: 5px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 1;
        }
        .slider-thumb {
            position: absolute;
            left: 50%;
            width: 63px;
            height: 36px;
            background: #ff5722;
            border: 2px solid #ff8a65;
            border-radius: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 3;
            box-sizing: border-box;
        }
        .turn-group {
            margin-top: 2px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: center;
        }
        .turn-group label {
            font-size: 13px;
            color: #ff8a65;
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .turn-buttons {
            display: flex;
            gap: 12px;
            flex-direction: row;
            height: 250px;
            margin-bottom: 8px;
        }
        .turn-buttons button {
            margin: 0;
            background-color: #37474f;
            font-size: 15px;
            flex: 1;
            height: 100%;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .turn-buttons button:hover {
            background-color: #455a64;
        }
        .key-hint {
            font-size: 11px;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 4px;
            color: #b0bec5;
        }
        .quick-presets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 4px;
        }
        .quick-btn {
            background-color: #2e7d32;
            font-size: 14px;
            padding: 14px 2px;
            margin: 0;
            border-radius: 8px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .presets-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 2px;
        }
        .preset-card {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 3px;
            text-align: center;
        }
        .preset-title {
            font-size: 10px;
            color: #ff8a65;
            font-weight: bold;
            margin-bottom: 1px;
        }
        .mini-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 1px;
            background: #000;
            padding: 2px;
            border-radius: 3px;
            margin: 0 auto 2px auto;
            width: 30px;
            height: 30px;
            cursor: pointer;
        }
        .mini-cell {
            background-color: #1a1a1a;
            border-radius: 1px;
        }
        .mini-cell.active {
            background-color: #ff5722;
        }
        .btn-save {
            background-color: #c62828;
            padding: 2px 2px;
            font-size: 9px;
            margin: 0;
            border-radius: 3px;
            width: 100%;
        }
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            background: #111;
            padding: 4px;
            border-radius: 8px;
            margin: 2px auto;
            width: 180px;
            height: 180px;
        }
        .matrix-cell {
            background-color: #262626;
            border: 1px solid #333;
            border-radius: 2px;
            cursor: pointer;
        }
        .matrix-cell.active {
            background-color: #ff5722;
            box-shadow: 0 0 4px #ff5722;
            border-color: #ff8a65;
        }
        .controls-row {
            display: flex;
            gap: 8px;
            margin: 2px 0;
            align-items: center;
            justify-content: space-between;
        }
        select {
            background: #262626;
            color: white;
            border: 1px solid #444;
            padding: 5px;
            border-radius: 6px;
            width: 100%;
            font-size: 12px;
        }
        @media (min-width: 900px) {
            .dashboard {
                flex-direction: row;
                align-items: stretch;
            }
            .container {
                flex: 1;
                max-width: 380px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- 1. LEFT PANEL: Connection & Throttle Slider -->
        <div class="container">
            <div>
                <h2 class="panel-title">Nebula Control</h2>
                <button id="connectBtn" onclick="connectBluetooth()">Connect ESP32</button>
                <div id="status">Status: Disconnected</div>
            </div>

            <div class="slider-section">
                <label>Throttle (Y): <span id="yVal">0</span></label>
                <div class="custom-slider-track" id="sliderTrack">
                    <div class="slider-center-marker"></div>
                    <div class="slider-fill" id="sliderFill"></div>
                    <div class="slider-thumb" id="sliderThumb"></div>
                </div>
            </div>
        </div>

        <!-- 2. MIDDLE PANEL: 8x8 LED Matrix Designer & Save Slots -->
        <div class="container">
            <h3 class="panel-title">LED Matrix Designer</h3>
            
            <div class="matrix-grid" id="matrixGrid"></div>

            <div class="controls-row">
                <select id="animMode" onchange="saveCurrentState()">
                    <option value="static">Static Display</option>
                    <option value="blink">Blinking Display</option>
                    <option value="refresh">Refresh (Sweep)</option>
                    <option value="pulse">Pulse Animation</option>
                </select>
                <button onclick="clearMatrix()" style="background-color: #424242; width: auto; padding: 5px 10px; margin:0;">Clear</button>
            </div>

            <label style="font-size: 10px; color: #b0bec5; display: block; margin: 0; font-weight: bold; line-height: 1;">Save Presets:</label>
            <div class="presets-container" id="presetsContainer"></div>
        </div>

        <!-- 3. RIGHT PANEL: Steering Control & Quick Display Buttons -->
        <div class="container">
            <h3 class="panel-title">Steering & Quick Display</h3>
            <div class="turn-group">
                <label>Turning Direction</label>
                <div class="turn-buttons">
                    <button id="leftBtn">&#9664; Left <span class="key-hint">[A]</span></button>
                    <button id="rightBtn">Right &#9654; <span class="key-hint">[D]</span></button>
                </div>

                <label style="margin-top: 8px;">Quick Presets (1-6)</label>
                <div class="quick-presets-grid">
                    <button class="quick-btn" onclick="playPreset(1)">P1 <span class="key-hint" style="font-size:10px; padding:1px 4px;">[1]</span></button>
                    <button class="quick-btn" onclick="playPreset(2)">P2 <span class="key-hint" style="font-size:10px; padding:1px 4px;">[2]</span></button>
                    <button class="quick-btn" onclick="playPreset(3)">P3 <span class="key-hint" style="font-size:10px; padding:1px 4px;">[3]</span></button>
                    <button class="quick-btn" onclick="playPreset(4)">P4 <span class="key-hint" style="font-size:10px; padding:1px 4px;">[4]</span></button>
                    <button class="quick-btn" onclick="playPreset(5)">P5 <span class="key-hint" style="font-size:10px; padding:1px 4px;">[5]</span></button>
                    <button class="quick-btn" onclick="playPreset(6)">P6 <span class="key-hint" style="font-size:10px; padding:1px 4px;">[6]</span></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let bluetoothDevice;
        let bluetoothCharacteristic;
        let activeAnimationInterval = null;

        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a6";

        let matrixData = JSON.parse(localStorage.getItem('nebula_matrix')) || Array(64).fill(false);
        let savedMode = localStorage.getItem('nebula_mode') || 'static';
        document.getElementById('animMode').value = savedMode;

        let presets = JSON.parse(localStorage.getItem('nebula_presets')) || Array(6).fill(null).map(() => ({
            pattern: Array(64).fill(false),
            mode: 'static'
        }));

        let isDrawing = false;
        let targetPaintState = true;

        document.addEventListener('pointerup', () => { isDrawing = false; });

        function saveCurrentState() {
            localStorage.setItem('nebula_matrix', JSON.stringify(matrixData));
            localStorage.setItem('nebula_mode', document.getElementById('animMode').value);
            localStorage.setItem('nebula_presets', JSON.stringify(presets));
        }

        function buildGrid() {
            const gridEl = document.getElementById('matrixGrid');
            gridEl.innerHTML = '';
            for (let i = 0; i < 64; i++) {
                const cell = document.createElement('div');
                cell.className = 'matrix-cell' + (matrixData[i] ? ' active' : '');
                
                cell.onpointerdown = (e) => {
                    e.preventDefault();
                    isDrawing = true;
                    targetPaintState = !matrixData[i];
                    matrixData[i] = targetPaintState;
                    cell.className = 'matrix-cell' + (matrixData[i] ? ' active' : '');
                    saveCurrentState();
                };

                cell.onpointerenter = () => {
                    if (isDrawing) {
                        matrixData[i] = targetPaintState;
                        cell.className = 'matrix-cell' + (matrixData[i] ? ' active' : '');
                        saveCurrentState();
                    }
                };

                gridEl.appendChild(cell);
            }
        }

        function buildPresetUI() {
            const container = document.getElementById('presetsContainer');
            container.innerHTML = '';
            
            for (let i = 0; i < 6; i++) {
                const card = document.createElement('div');
                card.className = 'preset-card';

                const title = document.createElement('div');
                title.className = 'preset-title';
                title.innerText = `Slot ${i + 1}`;
                card.appendChild(title);

                const miniGrid = document.createElement('div');
                miniGrid.className = 'mini-grid';
                for (let p = 0; p < 64; p++) {
                    const miniCell = document.createElement('div');
                    miniCell.className = 'mini-cell' + (presets[i].pattern[p] ? ' active' : '');
                    miniGrid.appendChild(miniCell);
                }
                
                miniGrid.onclick = () => {
                    matrixData = [...presets[i].pattern];
                    document.getElementById('animMode').value = presets[i].mode;
                    buildGrid();
                    saveCurrentState();
                };
                card.appendChild(miniGrid);

                const saveBtn = document.createElement('button');
                saveBtn.className = 'btn-save';
                saveBtn.innerText = 'Save';
                saveBtn.onclick = () => savePreset(i + 1);
                card.appendChild(saveBtn);

                container.appendChild(card);
            }
        }

        function clearMatrix() {
            matrixData.fill(false);
            buildGrid();
            saveCurrentState();
        }

        const track = document.getElementById('sliderTrack');
        const fill = document.getElementById('sliderFill');
        const thumb = document.getElementById('sliderThumb');
        const yValSpan = document.getElementById('yVal');

        function updateSliderVisuals(percentVal) {
            let displayVal = Math.round((percentVal - 50) * 2);
            yValSpan.innerText = displayVal;
            
            thumb.style.top = `${100 - percentVal}%`;

            if (percentVal > 50) {
                fill.style.top = `${100 - percentVal}%`;
                fill.style.bottom = `50%`;
                fill.style.backgroundColor = '#2196f3';
            } else if (percentVal < 50) {
                fill.style.top = `50%`;
                fill.style.bottom = `${percentVal}%`;
                fill.style.backgroundColor = '#f44336';
            } else {
                fill.style.top = `50%`;
                fill.style.bottom = `50%`;
                fill.style.backgroundColor = 'transparent';
            }
        }

        function handleSliderMove(e) {
            const rect = track.getBoundingClientRect();
            let clientY = e.clientY;
            let offsetY = clientY - rect.top;
            offsetY = Math.max(0, Math.min(rect.height, offsetY));

            let percentVal = Math.round(100 - (offsetY / rect.height) * 100);
            updateSliderVisuals(percentVal);
        }

        track.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            track.setPointerCapture(e.pointerId);
            handleSliderMove(e);
            
            track.onpointermove = (ev) => handleSliderMove(ev);
            track.onpointerup = (ev) => {
                track.releasePointerCapture(ev.pointerId);
                track.onpointermove = null;
                track.onpointerup = null;
                updateSliderVisuals(50);
            };
        });

        updateSliderVisuals(50);

        // Pointer-based mouse/touch buttons
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        leftBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            leftBtn.setPointerCapture(e.pointerId);
            leftBtn.style.backgroundColor = '#1e88e5';
        });
        leftBtn.addEventListener('pointerup', (e) => {
            leftBtn.releasePointerCapture(e.pointerId);
            leftBtn.style.backgroundColor = '#37474f';
        });

        rightBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            rightBtn.setPointerCapture(e.pointerId);
            rightBtn.style.backgroundColor = '#1e88e5';
        });
        rightBtn.addEventListener('pointerup', (e) => {
            rightBtn.releasePointerCapture(e.pointerId);
            rightBtn.style.backgroundColor = '#37474f';
        });

        // -------------------------------------------------------------
        // LAPTOP KEYBOARD CONTROL HANDLER (W, A, S, D, Space, Presets 1-6)
        // -------------------------------------------------------------
        const pressedKeys = new Set();

        window.addEventListener('keydown', (e) => {
            if (['Space', 'KeyW', 'KeyS', 'KeyA', 'KeyD', 'Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6'].includes(e.code)) {
                e.preventDefault();
            }

            // Trigger presets 1-6 directly on key press
            if (e.code === 'Digit1') playPreset(1);
            if (e.code === 'Digit2') playPreset(2);
            if (e.code === 'Digit3') playPreset(3);
            if (e.code === 'Digit4') playPreset(4);
            if (e.code === 'Digit5') playPreset(5);
            if (e.code === 'Digit6') playPreset(6);

            pressedKeys.add(e.code);
            evaluateKeyboardControls();
        });

        window.addEventListener('keyup', (e) => {
            pressedKeys.delete(e.code);
            evaluateKeyboardControls();
        });

        function evaluateKeyboardControls() {
            let isBoosting = pressedKeys.has('Space');
            
            // Throttle evaluation (W / S)
            let throttlePercent = 50; // Neutral
            if (pressedKeys.has('KeyW') && !pressedKeys.has('KeyS')) {
                // Speed 2 (Boost) = 100%, Speed 1 = 75%
                throttlePercent = isBoosting ? 100 : 75;
            } else if (pressedKeys.has('KeyS') && !pressedKeys.has('KeyW')) {
                // Speed 2 (Boost) = 0%, Speed 1 = 25%
                throttlePercent = isBoosting ? 0 : 25;
            }
            updateSliderVisuals(throttlePercent);

            // Steering evaluation (A / D)
            if (pressedKeys.has('KeyA')) {
                leftBtn.style.backgroundColor = '#1e88e5';
            } else {
                leftBtn.style.backgroundColor = '#37474f';
            }

            if (pressedKeys.has('KeyD')) {
                rightBtn.style.backgroundColor = '#1e88e5';
            } else {
                rightBtn.style.backgroundColor = '#37474f';
            }
        }

        async function connectBluetooth() {
            const statusEl = document.getElementById('status');
            const connectBtnEl = document.getElementById('connectBtn');

            if (!navigator.bluetooth) {
                statusEl.innerText = "Status: Bluetooth unsupported on iOS!";
                statusEl.style.color = "#ef5350";
                alert("Web Bluetooth is not supported in standard iOS/iPadOS browsers. Please use a Web BLE browser app from the App Store (such as 'Bluefy' or 'BLE Link') to connect your ESP32.");
                return;
            }

            try {
                statusEl.innerText = "Status: Scanning...";
                statusEl.classList.remove('connected');
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                statusEl.innerText = "Status: Connected!";
                statusEl.classList.add('connected');
                connectBtnEl.innerText = "Connected";
                connectBtnEl.style.backgroundColor = "#555";
            } catch (error) {
                console.error(error);
                statusEl.innerText = "Status: Connection Failed";
                statusEl.style.color = "#ef5350";
            }
        }

        function savePreset(presetId) {
            let index = presetId - 1;
            presets[index].pattern = [...matrixData];
            presets[index].mode = document.getElementById('animMode').value;
            buildPresetUI();
            saveCurrentState();
            playPreset(presetId);
        }

        async function playPreset(presetId) {
            let index = presetId - 1;
            matrixData = [...presets[index].pattern];
            document.getElementById('animMode').value = presets[index].mode;
            buildGrid();
            saveCurrentState();

            const mode = presets[index].mode;
            const pattern = presets[index].pattern;

            if (activeAnimationInterval) {
                clearInterval(activeAnimationInterval);
                activeAnimationInterval = null;
            }

            async function sendRows(rowsArray) {
                if (!bluetoothCharacteristic) return;
                let payload = "R:" + rowsArray.join(',');
                try {
                    const encoder = new TextEncoder();
                    await bluetoothCharacteristic.writeValue(encoder.encode(payload));
                } catch (err) {
                    console.error("Transmission error:", err);
                }
            }

            let getRowBytes = (customPattern) => {
                let rotated = Array(64).fill(false);
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if (customPattern[r * 8 + c]) {
                            rotated[(7 - c) * 8 + r] = true;
                        }
                    }
                }
                let rows = [];
                for (let r = 0; r < 8; r++) {
                    let byteVal = 0;
                    for (let c = 0; c < 8; c++) {
                        if (rotated[r * 8 + c]) byteVal |= (1 << (7 - c));
                    }
                    rows.push(byteVal);
                }
                return rows;
            };

            let baseRows = getRowBytes(pattern);
            let emptyRows = [0, 0, 0, 0, 0, 0, 0, 0];

            if (mode === 'static') {
                await sendRows(baseRows);
            } 
            else if (mode === 'blink') {
                let state = true;
                await sendRows(baseRows);
                activeAnimationInterval = setInterval(async () => {
                    await sendRows(state ? emptyRows : baseRows);
                    state = !state;
                }, 500);
            } 
            else if (mode === 'refresh') {
                let sweepRow = 0;
                activeAnimationInterval = setInterval(async () => {
                    let frame = [...emptyRows];
                    frame[sweepRow] = baseRows[sweepRow];
                    await sendRows(frame);
                    sweepRow++;
                    if (sweepRow > 7) sweepRow = 0;
                }, 100);
            }
            else if (mode === 'pulse') {
                let visible = true;
                activeAnimationInterval = setInterval(async () => {
                    await sendRows(visible ? baseRows : emptyRows);
                    visible = !visible;
                }, 150);
            }
        }

        buildGrid();
        buildPresetUI();
    </script>
</body>
</html>
